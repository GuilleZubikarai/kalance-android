name: Verify official Android 1.4.0 distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: GuilleZubikarai/kalance-android
    steps:
      - name: Verify public APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.4.0
          apk=Kalance-1.4.0.apk
          expected_sha=142659c0b396e34689fb511c65e2c61e2150e624f5228131f9db936159a677ad
          expected_size=25157333
          release_json=$(gh api "repos/$GH_REPO/releases/tags/$tag")
          test "$(jq -r '.draft' <<< "$release_json")" = false
          test "$(jq -r '.prerelease' <<< "$release_json")" = false
          test "$(jq '[.assets[] | select(.name == "Kalance-1.4.0.apk" and .size == 25157333 and .state == "uploaded")] | length' <<< "$release_json")" = 1
          test "$(jq '[.assets[] | select(.name == "SHA256SUMS" and .size == 84 and .state == "uploaded")] | length' <<< "$release_json")" = 1
          gh release download "$tag" --pattern "$apk" --pattern SHA256SUMS
          test "$(stat -c %s "$apk")" = "$expected_size"
          printf '%s  %s\n' "$expected_sha" "$apk" > expected-checksum
          cmp expected-checksum SHA256SUMS
          sha256sum --check SHA256SUMS
          rm "$apk" SHA256SUMS expected-checksum
